<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
    <title>Herdr Pocket 灵动岛提醒</title>
    <style>
      :root {
        --notch-w: 0px;
        --notch-top: 4px;
        --island-bg: rgba(11, 11, 15, 0.96);
        --island-border: rgba(255, 255, 255, 0.14);
        --island-fg: #f8fafc;
        --island-muted: rgba(248, 250, 252, 0.68);
        --accent-approval: #fb7185;
        --accent-question: #fbbf24;
        --accent-error: #f97316;
        --accent-completed: #34d399;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        color: var(--island-fg);
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      .island {
        width: 100%;
        height: 100%;
        background: var(--island-bg);
        border: 1px solid var(--island-border);
        border-radius: 0 0 20px 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: border-radius 220ms cubic-bezier(0.22, 1, 0.36, 1), background-color 180ms ease;
      }

      body[data-has-notch="false"] .island {
        border-radius: 18px;
      }

      .compact-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 0 12px;
        gap: 8px;
        cursor: pointer;
      }

      .compact-ear {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .compact-spacer {
        width: var(--notch-w);
        flex: none;
        height: 100%;
      }

      .mascot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
      }

      .mascot-lg {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: none;
      }

      .dot.approval {
        background: var(--accent-approval);
      }
      .dot.question {
        background: var(--accent-question);
      }
      .dot.error {
        background: var(--accent-error);
      }
      .dot.completed {
        background: var(--accent-completed);
      }

      .compact-label {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--island-fg);
        white-space: nowrap;
      }

      .count-pill {
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-variant-numeric: tabular-nums;
      }

      .peek-view,
      .expanded-view {
        display: none;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      body[data-mode="compact"] .compact-bar {
        display: flex;
      }
      body[data-mode="peek"] .compact-bar,
      body[data-mode="expanded"] .compact-bar {
        display: none;
      }
      body[data-mode="peek"] .peek-view {
        display: flex;
      }
      body[data-mode="expanded"] .expanded-view {
        display: flex;
      }

      .notch-bridge {
        height: var(--notch-top);
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        font-size: 11px;
        color: var(--island-muted);
      }

      .peek-body {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 14px 10px;
      }

      .peek-copy {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .peek-top {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .cat-tag {
        padding: 1px 7px;
        border-radius: 999px;
        font-size: 10.5px;
        font-weight: 700;
        flex: none;
      }
      .cat-tag.approval {
        background: rgba(251, 113, 133, 0.22);
        color: #fda4af;
      }
      .cat-tag.question {
        background: rgba(251, 191, 36, 0.22);
        color: #fde68a;
      }
      .cat-tag.error {
        background: rgba(249, 115, 22, 0.24);
        color: #fdba74;
      }
      .cat-tag.completed {
        background: rgba(52, 211, 153, 0.22);
        color: #6ee7b7;
      }

      .item-title {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--island-fg);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-sub {
        font-size: 11.5px;
        color: var(--island-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .jump-btn {
        height: 26px;
        padding: 0 11px;
        border-radius: 999px;
        border: 0;
        background: #ec4899;
        color: #fff;
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        flex: none;
      }

      .jump-btn:hover {
        background: #db2777;
      }

      .exp-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 14px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .exp-title {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 700;
      }

      .exp-clear {
        border: 0;
        background: transparent;
        color: var(--island-muted);
        font-size: 11px;
        cursor: pointer;
        padding: 3px 6px;
        border-radius: 6px;
      }

      .exp-clear:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }

      .exp-filters {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 12px;
      }

      .filter-chip {
        border: 0;
        border-radius: 999px;
        padding: 3px 8px;
        background: transparent;
        color: var(--island-muted);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
      }

      .filter-chip.active {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }

      .exp-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .exp-card {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.07);
      }

      .exp-card:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .exp-card-body {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        cursor: pointer;
      }

      .exp-close {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        border: 0;
        background: transparent;
        color: var(--island-muted);
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        flex: none;
      }

      .exp-close:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
      }

      .exp-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--island-muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body data-mode="compact" data-has-notch="true">
    <div id="island" class="island">
      <div id="compactBar" class="compact-bar" role="button" tabindex="0" aria-label="展开灵动岛提醒队列">
        <div class="compact-ear">
          <img class="mascot" src="brand/mascot/call-listening.webp" alt="" />
          <span id="compactDot" class="dot approval"></span>
        </div>
        <div class="compact-spacer" aria-hidden="true"></div>
        <div class="compact-ear">
          <span id="compactLabel" class="compact-label">待处理</span>
          <span id="compactCount" class="count-pill">0</span>
        </div>
      </div>

      <div id="peekView" class="peek-view">
        <div class="notch-bridge" aria-hidden="true"></div>
        <div class="peek-body">
          <img class="mascot-lg" src="brand/mascot/call-listening.webp" alt="" />
          <div class="peek-copy">
            <div class="peek-top">
              <span id="peekTag" class="cat-tag approval">需要审批</span>
              <span id="peekTitle" class="item-title">Herdr Pocket</span>
            </div>
            <div id="peekSub" class="item-sub">等待确认</div>
          </div>
          <button id="peekJumpBtn" type="button" class="jump-btn">跳转</button>
        </div>
      </div>

      <div id="expandedView" class="expanded-view">
        <div class="notch-bridge" aria-hidden="true"></div>
        <div class="exp-head">
          <div class="exp-title">
            <img class="mascot" src="brand/mascot/call-listening.webp" alt="" />
            <span>Ovis 待处理提醒</span>
            <span id="expTotal" class="count-pill">0</span>
          </div>
          <div>
            <button id="openMainBtn" type="button" class="exp-clear">主窗口</button>
            <button id="clearAllBtn" type="button" class="exp-clear">全部已读</button>
          </div>
        </div>
        <div id="expFilters" class="exp-filters"></div>
        <div id="expList" class="exp-list"></div>
      </div>
    </div>

    <script src="notch-hud.js"></script>
  </body>
</html>
