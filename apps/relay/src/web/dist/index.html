  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/x-icon" href="./assets/brand/favicon.ico" />
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/brand/favicon-64.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/brand/apple-touch-icon.png" />
  <title>Herdr Pocket</title>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("herdr-pocket-client-prefs-v1");
        var saved = raw ? JSON.parse(raw).theme : localStorage.getItem("herdr-pocket-client-theme");
        var dark = saved === "dark" || (saved !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        var meta = document.getElementById("pocket-theme-color");
        if (meta) meta.setAttribute("content", dark ? "#1E1A26" : "#FBF4FC");
      } catch (e) {}
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-CqtriOZs.js"></script>
