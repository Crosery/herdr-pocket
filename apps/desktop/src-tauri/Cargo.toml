[package]
name = "herdr-pocket-desktop"
version = "0.2.0"
description = "Herdr Pocket Desktop Client"
authors = ["Herdr Pocket"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "herdr_pocket_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
