name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Relay and host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @herdr-pocket/relay test
      - run: pnpm --filter @herdr-pocket/hostd test
      - run: pnpm --filter @herdr-pocket/update test
      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh
      - name: Release bundle
        run: |
          scripts/pack-release.sh dist
          ls -l dist

  mobile:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      # The app is its own project, outside the root workspace.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm typecheck

  image:
    name: Relay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
