# A tag vX.Y.Z builds and publishes a release:
#   herdr-pocket-X.Y.Z.tar.gz                     relay + host bundle (installers & `update`)
#   herdr-pocket-X.Y.Z-android-arm64.apk          Android app
#   herdr-pocket-X.Y.Z-ios-arm64.ipa              iOS unsigned sideload package
#   herdr-pocket-X.Y.Z-harmonyos-arm64.hap        HarmonyOS NEXT unsigned HAP
#   herdr-pocket-X.Y.Z-macos-{arm64,x64}.dmg      macOS desktop installers
#   herdr-pocket-X.Y.Z-windows-x64-setup.exe      Windows desktop NSIS installer
#   herdr-pocket-X.Y.Z-windows-x64.msi            Windows desktop MSI installer
#   herdr-pocket-X.Y.Z-linux-x64.{deb,AppImage}   Linux desktop packages
#   RELEASE-NOTES.md                              Chinese release announcement
#   RELEASE-MANIFEST.json                         per-channel version/asset/sha256 manifest
#   SHA256SUMS                                    checksums of all artifacts
#   ghcr.io/<owner>/herdr-pocket-relay:X.Y.Z, :X.Y and :latest
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build again, e.g. v0.2.0
        required: true
      channels:
        description: Channels to build (auto, all, or comma list e.g. desktop,android)
        required: false
        default: auto

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
      CHANNELS: ${{ inputs.channels || 'auto' }}
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      build_bundle: ${{ steps.ch.outputs.build_bundle }}
      build_image: ${{ steps.ch.outputs.build_image }}
      build_android: ${{ steps.ch.outputs.build_android }}
      build_ios: ${{ steps.ch.outputs.build_ios }}
      build_harmony: ${{ steps.ch.outputs.build_harmony }}
      build_desktop: ${{ steps.ch.outputs.build_desktop }}
    steps:
      - id: v
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag"
            exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.v.outputs.tag }}
          fetch-depth: 0
      - id: prev
        run: |
          prev_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" --jq '[.[] | select(.draft == false and .tag_name != env.TAG)][0].tag_name // ""' || true)
          rm -f prev-manifest.json prev.sums
          if [ -n "$prev_tag" ]; then
            if gh release download "$prev_tag" --repo "$GITHUB_REPOSITORY" --pattern "RELEASE-MANIFEST.json" --output prev-manifest.json 2>/dev/null; then
              echo "Loaded RELEASE-MANIFEST.json from $prev_tag"
            elif gh release download "$prev_tag" --repo "$GITHUB_REPOSITORY" --pattern "SHA256SUMS" --output prev.sums 2>/dev/null; then
              node scripts/build-release-manifest.mjs --version "${prev_tag#v}" --prev-sums prev.sums --out prev-manifest.json
              echo "Synthesized prev-manifest.json from $prev_tag SHA256SUMS"
            fi
          fi
      - id: ch
        run: |
          node scripts/detect-release-channels.mjs \
            --tag "${{ steps.v.outputs.tag }}" \
            --channels "$CHANNELS" \
            --prev-manifest prev-manifest.json | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: prev-manifest
          path: prev-manifest.json
          if-no-files-found: ignore

  bundle:
    needs: meta
    if: needs.meta.outputs.build_bundle == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/set-version.mjs "$VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @herdr-pocket/relay test
      - run: pnpm --filter @herdr-pocket/hostd test
      - run: pnpm --filter @herdr-pocket/update test
      - run: scripts/pack-release.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/herdr-pocket-${{ needs.meta.outputs.version }}.tar.gz
          if-no-files-found: error

  image:
    needs: meta
    if: needs.meta.outputs.build_image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - run: node scripts/set-version.mjs "$VERSION"
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/herdr-pocket-relay" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.tag }}
      - uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    needs: meta
    if: needs.meta.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: node scripts/set-version.mjs "$VERSION"
      - name: Generate android/
        working-directory: apps/mobile
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm exec expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          signing=()
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            signing=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            )
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this APK is signed with the public debug key. Fine for testing; set the signing secrets before giving it to users."
          fi
          ./gradlew assembleRelease --no-daemon -I ../deps/local-maven.gradle -PreactNativeArchitectures=arm64-v8a -Pexpo.webp.animated=true "${signing[@]}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          apk="$GITHUB_WORKSPACE/dist/herdr-pocket-$VERSION-android-arm64.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          certs=$("$apksigner" verify --print-certs "$apk")
          {
            echo "### APK signer"
            echo '```'
            grep -E "certificate (DN|SHA-256 digest):" <<<"$certs" | sed -E 's/^.*certificate /certificate /' | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/herdr-pocket-${{ needs.meta.outputs.version }}-android-arm64.apk
          if-no-files-found: error

  ios:
    needs: meta
    if: needs.meta.outputs.build_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      XCODE_APP: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version | tee /dev/stderr | grep -q "^Xcode 26.6"
      - run: node scripts/set-version.mjs "$VERSION"
      - name: Native project
        working-directory: apps/mobile
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm exec expo prebuild --platform ios --no-install
          node scripts/stage-ios-onnxruntime.mjs
          cd ios && pod install
      - name: Archive unsigned IPA
        working-directory: apps/mobile/ios
        run: |
          xcodebuild archive -workspace HerdrPocket.xcworkspace -scheme HerdrPocket -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/HerdrPocket.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$GITHUB_WORKSPACE/dist"
          app_src=$(find "$RUNNER_TEMP/HerdrPocket.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          test -n "$app_src"
          app_dst="$RUNNER_TEMP/ipa/Payload/$(basename "$app_src")"
          ditto "$app_src" "$app_dst"
          if [ -d "$app_dst/Frameworks" ]; then
            for fw in "$app_dst/Frameworks/"*; do
              [ -e "$fw" ] && codesign --force --sign - --timestamp=none "$fw"
            done
          fi
          codesign --force --sign - --timestamp=none "$app_dst"
          codesign -dv "$app_dst" 2>&1 | grep -E "^(Identifier|Signature)"
          (cd "$RUNNER_TEMP/ipa" && ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/dist/herdr-pocket-$VERSION-ios-arm64.ipa")
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/herdr-pocket-${{ needs.meta.outputs.version }}-ios-arm64.ipa
          if-no-files-found: error

  harmony:
    needs: meta
    if: needs.meta.outputs.build_harmony == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: node scripts/set-version.mjs "$VERSION"
      # Must run on Node 24 before setup-ohos prepends Node 18 to PATH.
      - name: Build web rawfile bundle
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build:harmony
      - name: Install SDK runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: ErBWs/setup-ohos@v2
        with:
          version: '6.1.1.280'
          cache: true
      - name: Build unsigned HAP
        working-directory: apps/harmony
        run: |
          ohpm install --all
          hvigorw assembleHap --mode module -p module=entry@default -p product=default -p buildMode=release --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          hap=$(find entry/build -name "*.hap" | head -n 1)
          test -n "$hap"
          cp "$hap" "$GITHUB_WORKSPACE/dist/herdr-pocket-$VERSION-harmonyos-arm64.hap"
      - uses: actions/upload-artifact@v7
        with:
          name: harmony
          path: dist/herdr-pocket-${{ needs.meta.outputs.version }}-harmonyos-arm64.hap
          if-no-files-found: error

  desktop:
    needs: meta
    if: needs.meta.outputs.build_desktop == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app
            artifact: desktop-macos-arm64
            arch: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app
            artifact: desktop-macos-x64
            arch: x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: desktop-windows-x64
            arch: x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: desktop-linux-x64
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.artifact }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Stamp version
        shell: bash
        run: node scripts/set-version.mjs "$VERSION"
      - name: Install JS deps
        working-directory: apps/desktop
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_BASE64" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "Apple Developer ID signing secrets not configured; continuing with ad-hoc fallback"
            exit 0
          fi
          kc="$RUNNER_TEMP/build.keychain-db"
          kc_pass=$(/usr/bin/openssl rand -hex 16)
          p12="$RUNNER_TEMP/cert.p12"
          (umask 077 && printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$p12")
          test -s "$p12"
          security create-keychain -p "$kc_pass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pass" "$kc"
          security import "$p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$kc"
          kcs=("$kc")
          while IFS= read -r k_line; do
            k_trimmed=$(printf '%s' "$k_line" | sed 's/^[[:space:]]*"//;s/"[[:space:]]*$//')
            [ -n "$k_trimmed" ] && kcs+=("$k_trimmed")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${kcs[@]}"
          sign_id=$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application:/ {print $2; exit}')
          test -n "$sign_id"
          echo "APPLE_SIGNING_IDENTITY=$sign_id" >> "$GITHUB_ENV"
          echo "Imported Developer ID Application identity for macOS signing"
      - name: Build Tauri bundle
        working-directory: apps/desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}"
      - name: Collect Unix packages
        if: runner.os != 'Windows'
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p dist
          base="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ runner.os }}" = "macOS" ]; then
            app=$(find "$base/macos" -maxdepth 1 -name "*.app" | head -n 1)
            test -n "$app"
            if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              while IFS= read -r -d '' bin_file; do
                codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$bin_file"
              done < <(find "$app/Contents" -type f \( -name "*.dylib" -o -name "*.so" \) -print0)
              for exe in "$app/Contents/MacOS/"*; do
                [ -e "$exe" ] && codesign --force --options runtime --timestamp \
                  --entitlements apps/desktop/src-tauri/entitlements.plist \
                  --sign "$APPLE_SIGNING_IDENTITY" "$exe"
              done
              codesign --force --options runtime --timestamp \
                --entitlements apps/desktop/src-tauri/entitlements.plist \
                --sign "$APPLE_SIGNING_IDENTITY" "$app"
              codesign --verify --deep --strict --verbose=2 "$app"
              codesign -dv "$app" 2>&1 | grep -q "Authority=Developer ID Application"
              codesign -dr - "$app" 2>&1 | grep -q "anchor apple generic"
            elif ! codesign --verify --deep --strict "$app" 2>/dev/null; then
              codesign --force --deep --sign - --entitlements apps/desktop/src-tauri/entitlements.plist "$app"
              codesign --verify --deep --strict "$app"
            fi
            dmg="dist/herdr-pocket-$VERSION-macos-${{ matrix.arch }}.dmg"
            python3 -m venv "$RUNNER_TEMP/dmg-venv"
            "$RUNNER_TEMP/dmg-venv/bin/pip" install --quiet dmgbuild==2.0.0
            "$RUNNER_TEMP/dmg-venv/bin/dmgbuild" \
              -s scripts/dmg-settings.py \
              -D "app=$app" \
              -D "repo=$GITHUB_WORKSPACE" \
              "Herdr Pocket" \
              "$dmg"
            if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
              if [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
                p8="$RUNNER_TEMP/AuthKey.p8"
                (umask 077 && printf '%s\n' "$APPLE_API_KEY" > "$p8")
                xcrun notarytool submit "$dmg" \
                  --key "$p8" \
                  --key-id "$APPLE_API_KEY_ID" \
                  --issuer "$APPLE_API_ISSUER" \
                  --wait --timeout 20m
                rm -f "$p8"
                xcrun stapler staple "$dmg"
                xcrun stapler validate "$dmg"
              fi
            fi
          else
            deb=$(find "$base/deb" -maxdepth 1 -name "*.deb" | head -n 1)
            appimg=$(find "$base/appimage" -maxdepth 1 -name "*.AppImage" | head -n 1)
            cp "$deb" "dist/herdr-pocket-$VERSION-linux-x64.deb"
            cp "$appimg" "dist/herdr-pocket-$VERSION-linux-x64.AppImage"
          fi
      - name: Cleanup macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build.keychain-db" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
      - name: Collect Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $base = "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          $exe = Get-ChildItem "$base/nsis/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$base/msi/*.msi" | Select-Object -First 1
          Copy-Item $exe.FullName "dist/herdr-pocket-$env:VERSION-windows-x64-setup.exe"
          Copy-Item $msi.FullName "dist/herdr-pocket-$env:VERSION-windows-x64.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/herdr-pocket-*
          if-no-files-found: error

  release:
    needs: [meta, bundle, image, android, ios, harmony, desktop]
    if: >-
      always() &&
      needs.meta.result == 'success' &&
      (needs.bundle.result == 'success' || needs.bundle.result == 'skipped') &&
      (needs.image.result == 'success' || needs.image.result == 'skipped') &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.harmony.result == 'success' || needs.harmony.result == 'skipped') &&
      (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') &&
      (needs.ios.result == 'success' || needs.ios.result == 'failure' || needs.ios.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      IMAGE: ${{ needs.image.outputs.image || format('ghcr.io/{0}/herdr-pocket-relay', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
          path: repo-src
          fetch-depth: 0
      - run: mkdir -p dist
      - uses: actions/download-artifact@v8
        if: needs.bundle.result == 'success'
        with:
          name: bundle
          path: dist
      - uses: actions/download-artifact@v8
        if: needs.android.result == 'success'
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v8
        if: needs.ios.result == 'success'
        with:
          name: ios
          path: dist
      - uses: actions/download-artifact@v8
        if: needs.harmony.result == 'success'
        with:
          name: harmony
          path: dist
      - uses: actions/download-artifact@v8
        if: needs.desktop.result == 'success'
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: prev-manifest
          path: prev-manifest
      - name: Preserve pre-uploaded notarized macOS DMGs
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p dist-pre
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "herdr-pocket-$VERSION-macos-*.dmg" --dir dist-pre 2>/dev/null; then
              for f in dist-pre/herdr-pocket-$VERSION-macos-*.dmg; do
                [ -s "$f" ] && cp -f "$f" "dist/$(basename "$f")" && echo "Preserved notarized asset: $(basename "$f")"
              done
            fi
          fi
      - name: Carry forward unchanged client packages
        run: |
          prev_flag=""
          if [ -s prev-manifest/prev-manifest.json ]; then
            prev_flag="prev-manifest/prev-manifest.json"
          fi
          node repo-src/scripts/sync-carried-release-assets.mjs \
            --carry \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --dist dist \
            ${prev_flag:+--prev "$prev_flag"}
      - name: Prepare release announcement
        run: |
          rm -f announcement.md
          notes_file="repo-src/docs/releases/$TAG.md"
          if [ -s "$notes_file" ]; then
            cp "$notes_file" announcement.md
          else
            git -C repo-src tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----$/,$d' > announcement.md
          fi
          bytes=$(wc -c < announcement.md | tr -d ' ')
          if [ "${bytes:-0}" -lt 40 ]; then
            echo "::error::Missing detailed release announcement in docs/releases/$TAG.md or annotated tag $TAG"
            exit 1
          fi
          cp announcement.md dist/RELEASE-NOTES.md
      - name: Build per-channel RELEASE-MANIFEST.json & SHA256SUMS
        run: |
          prev_flag=""
          if [ -s prev-manifest/prev-manifest.json ]; then
            prev_flag="prev-manifest/prev-manifest.json"
          fi
          node repo-src/scripts/build-release-manifest.mjs \
            --version "$VERSION" \
            --dist dist \
            ${prev_flag:+--prev "$prev_flag"} \
            --out dist/RELEASE-MANIFEST.json
          cat dist/RELEASE-MANIFEST.json
          cd dist
          LC_ALL=C sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        run: |
          if ls dist/herdr-pocket-*-ios-arm64.ipa >/dev/null 2>&1; then
            mobile_line='- **Mobile clients**: Android (`.apk`), iOS (`.ipa` unsigned sideload), HarmonyOS NEXT (`.hap` unsigned)'
          else
            mobile_line='- **Mobile clients**: Android (`.apk`), HarmonyOS NEXT (`.hap` unsigned)'
          fi
          node repo-src/scripts/sync-carried-release-assets.mjs \
            --render-table dist/RELEASE-MANIFEST.json \
            --repo "$GITHUB_REPOSITORY" \
            --release-tag "$TAG" \
            --out download-table.md
          cat announcement.md > notes.md
          printf '\n\n---\n\n' >> notes.md
          cat download-table.md >> notes.md
          printf '\n' >> notes.md
          cat >> notes.md <<EOF
          Relay image: \`${IMAGE,,}:$VERSION\` (per-channel metadata in \`RELEASE-MANIFEST.json\`)

          - **Server**: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install-relay.sh | sudo bash -s -- --domain pocket.example.com\`
          - **Computer daemon**: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install-host.sh | bash -s -- --server https://pocket.example.com\` (Windows: \`install-host.ps1\`)
          $mobile_line
          - **Desktop clients**: macOS (\`arm64\`/\`x64\` \`.dmg\`), Windows (\`-setup.exe\`/\`.msi\`), Linux (\`.AppImage\`/\`.deb\`)
          - **Update**: \`herdr-pocket update\` on computers, \`sudo herdr-pocket-relay update\` on the server, or check inside the client settings.
          EOF
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --title "Herdr Pocket $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Herdr Pocket $VERSION" --notes-file notes.md --generate-notes "${flags[@]}"
          fi
