<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Herdr Pocket 语音输入</title>
<!--
  The dictation HUD (src-tauri/src/voice/hud.rs). Standalone: no app bundle, no IPC.
  Rust pushes the state with window.__hud(state):
    { state: "recording", level: 0..1, elapsedMs, hint?, sounds?, maxSeconds? }
    { state: "transcribing", sounds? }
    { state: "done", label, note?, chars? }
    { state: "error", message }
    { state: "cancelled" }
-->
<style>
  :root {
    --pink: #ff8fb3;
    --pink-deep: #ff7ea8;
    --accent-text: #b8336a;
    --ink: #4a3b5c;
    --muted: #8a7b9a;
    --surface: rgba(255, 255, 255, 0.94);
    --line: rgba(255, 126, 168, 0.34);
    --danger: #e0456d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f3edf7;
      --muted: #b9adc6;
      --surface: rgba(39, 33, 47, 0.94);
      --accent-text: #ffb3cb;
    }
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
  }
  .hud {
    box-sizing: border-box;
    width: 248px;
    height: 52px;
    padding: 0 16px 0 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 999px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    box-shadow: 0 6px 18px rgba(184, 51, 106, 0.18);
    opacity: 0;
    transform: translateY(6px) scale(0.98);
    transition: opacity 160ms ease-out, transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .hud.on { opacity: 1; transform: none; }
  .dot {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--pink);
    display: grid;
    place-items: center;
    position: relative;
  }
  .dot::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid var(--pink);
    opacity: 0;
  }
  .recording .dot::after { animation: ring 1.2s ease-out infinite; }
  @keyframes ring { from { opacity: 0.7; transform: scale(0.85); } to { opacity: 0; transform: scale(1.35); } }
  .dot svg { width: 14px; height: 14px; fill: #fff; }
  .error .dot { background: var(--danger); }
  .error .dot::after { border-color: var(--danger); }
  .bars {
    flex: none;
    display: flex;
    align-items: center;
    gap: 3px;
    height: 24px;
  }
  .bars i {
    display: block;
    width: 3px;
    height: 4px;
    border-radius: 2px;
    background: var(--pink-deep);
    transition: height 90ms linear;
  }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .title {
    font-size: 13px;
    font-weight: 700;
    line-height: 17px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub {
    font-size: 11px;
    line-height: 15px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .error .title { color: var(--danger); white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 12px; line-height: 15px; }
  .time { flex: none; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--accent-text); font-weight: 700; }
  .spin {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .hud, .bars i { transition: none; }
    .recording .dot::after, .spin { animation: none; }
  }
</style>
</head>
<body>
<div class="hud" id="hud" role="status" aria-live="polite">
  <div class="dot" id="dot"></div>
  <div class="bars" id="bars" hidden></div>
  <div class="text">
    <div class="title" id="title">语音输入</div>
    <div class="sub" id="sub" hidden></div>
  </div>
  <div class="time" id="time" hidden></div>
</div>
<script src="voice-hud.js"></script>
</body>
</html>
