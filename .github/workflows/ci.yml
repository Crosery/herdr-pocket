name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Relay and host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @herdr-pocket/relay test
      - run: pnpm --filter @herdr-pocket/hostd test
      - run: pnpm --filter @herdr-pocket/update test
      - name: Shell scripts
        run: shellcheck -S warning scripts/*.sh
      - name: Release bundle
        run: |
          scripts/pack-release.sh dist
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/herdr-pocket-*.tar.gz
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Windows computer
    needs: server
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @herdr-pocket/hostd test
      - run: pnpm --filter @herdr-pocket/update test
      - name: Installer script lint
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $found = Invoke-ScriptAnalyzer -Path scripts\install-host.ps1 -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions, PSUseApprovedVerbs, PSUseSingularNouns
          $found | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($found | Where-Object Severity -eq Error) { exit 1 }
      - uses: actions/download-artifact@v8
        with:
          name: bundle
          path: dist
      # The real thing in Windows PowerShell 5.1: install from the bundle, run as the logon
      # service, update in place (junction swap + service hand-over), roll back, remove.
      - name: Install, service, update
        shell: powershell
        run: .github\windows-install-test.ps1 -Bundle (Get-ChildItem dist\herdr-pocket-*.tar.gz).FullName

  mobile:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml
      # The app is its own project, outside the root workspace.
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm typecheck

  image:
    name: Relay image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
