// Artifacts Gradle could not download cleanly (including Maven Central / Gradle Plugin Portal
// mirrors and animated-webp) are kept in deps/maven. Use with:
//   ./gradlew assembleRelease -I ../deps/local-maven.gradle
def localMaven = new File(buildscript.sourceFile.parentFile, "maven").toURI()
beforeSettings { settings ->
  settings.pluginManagement {
    repositories {
      maven { url = localMaven }
      gradlePluginPortal()
      mavenCentral()
      google()
    }
  }
}
allprojects {
  repositories {
    maven { url = localMaven }
  }
}
